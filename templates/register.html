<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | AI Missing Information Detective</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4efe6;
            font-family: Arial, sans-serif;
            color: #17232b;
        }

        .register-card {
            width: 400px;
            max-width: 92%;
            background: #fffdf8;
            padding: 40px;
            border-radius: 14px;
            box-shadow: 0 12px 35px rgba(30, 25, 20, 0.12);
            border: 1px solid #e5dccd;
        }

        .badge {
            color: #b64b3d;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        h1 {
            font-family: Georgia, serif;
            font-size: 32px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #77716a;
            font-size: 13px;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 12px 13px;
            margin-bottom: 18px;
            border: 1px solid #d8cfc1;
            border-radius: 7px;
            background: #fff;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #b64b3d;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #c95745;
            color: white;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #ad4536;
        }

        .error {
            background: #fbe8e5;
            color: #a33d32;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 18px;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #77716a;
        }

        .login-link a {
            color: #b64b3d;
            font-weight: 700;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="register-card">

    <div class="badge">CASE FILE SYSTEM</div>

    <h1>Create Account</h1>

    <p class="subtitle">
        Create your detective account to start investigating documents.
    </p>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST" action="{{ url_for('register') }}">

        <label>Name</label>

        <input
            type="text"
            name="name"
            placeholder="Enter your name"
            required
        >

        <label>Email</label>

        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required
        >

        <label>Password</label>

        <input
            type="password"
            name="password"
            placeholder="Create a password"
            required
        >

        <button type="submit">
            CREATE ACCOUNT
        </button>

    </form>

    <div class="login-link">
        Already have an account?
        <a href="{{ url_for('login') }}">Login</a>
    </div>

</div>

</body>
</html>
